<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a365d">
    <title>Sistema de Gestión - Mundo Escolar</title>

    <!-- Bootstrap 5.3.2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="static/css/style.css?v=9.8">

    <style>
        /* Ajuste fino de Login v7.0 */
        .login-card {
            border: none;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3) !important;
        }
    </style>
</head>

<body>
    <!-- Navbar Minimalista para Login -->
    <nav class="navbar navbar-dark bg-dark fixed-top shadow-sm">
        <div class="container-fluid justify-content-center">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-map-marked-alt me-2"></i>
                Gestión Clientes
            </a>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="main-content">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="text-center mb-4">
                        <i class="fas fa-map-marked-alt fa-3x mb-3"></i>
                        <h2 class="h3 fw-bold">Sistema de Gestión</h2>
                        <p class="mb-0 opacity-75">Acceso al sistema de clientes</p>
                    </div>
                </div>

                <div class="login-body">
                    <div id="login-error" class="alert alert-danger d-flex align-items-center d-none" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <div id="error-message"></div>
                    </div>

                    <form id="login-form" class="needs-validation" novalidate>
                        <div class="mb-4">
                            <label for="username" class="form-label fw-semibold">
                                <i class="fas fa-user me-2"></i>Usuario
                            </label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username"
                                required placeholder="Ingresa tu usuario">
                            <div class="invalid-feedback">
                                Por favor ingresa tu usuario.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">
                                <i class="fas fa-lock me-2"></i>Contraseña
                            </label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password"
                                required placeholder="Ingresa tu contraseña">
                            <div class="invalid-feedback">
                                Por favor ingresa tu contraseña.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-semibold">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            Ingresar al Sistema
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted small mb-0">
                            <i class="fas fa-shield-alt me-1"></i>
                            Sistema seguro &copy; 2024 Mundo Escolar
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts con Inyector Anticaché v5.0 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        (function () {
            const scripts = [
                'static/js/utils.js',
                'static/js/auth.js',
                'static/js/db.js',
                'static/js/sync.js',
                'static/js/api.js'
            ];
            const t = Date.now();
            scripts.forEach(src => {
                const s = document.createElement('script');
                s.src = src + '?v=9.8&t=' + t;
                s.async = false;
                document.body.appendChild(s);
            });
            console.log('🚀 index.html v5.0: Scripts inyectados con t=' + t);
        })();
    </script>

    <script>
        // ✅ MOSTRAR MENSAJE DE SESIÓN CERRADA AL CARGAR LOGIN
        (function() {
            // Esperar a que authSystem esté disponible
            const checkAuth = setInterval(() => {
                if (typeof authSystem !== 'undefined') {
                    clearInterval(checkAuth);
                    
                    // Verificar si hay mensaje de sesión cerrada
                    const mensaje = authSystem.obtenerMensajeSesionCerrada();
                    if (mensaje) {
                        const errorDiv = document.getElementById('login-error');
                        const errorMessage = document.getElementById('error-message');
                        if (errorDiv && errorMessage) {
                            errorMessage.textContent = mensaje;
                            errorDiv.classList.remove('d-none');
                        }
                    }
                    
                    // Si ya está logueado, redirigir
                    if (authSystem.isLoggedIn()) {
                        window.location.href = 'trabajadores.html';
                    }
                }
            }, 100);
        })();
    </script>

    <script>
        // Validación de formularios
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()

        // Sistema de autenticación mejorado
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            const errorMessage = document.getElementById('error-message');
            const submitBtn = this.querySelector('button[type="submit"]');

            // Deshabilitar botón durante el proceso
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Verificando...';

            try {
                const result = await authSystem.login(username, password);

                if (result.success) {
                    // Ocultar error si estaba visible
                    errorDiv.classList.add('d-none');

                    // Mostrar mensaje de éxito
                    submitBtn.innerHTML = '<i class="fas fa-check me-2"></i>¡Bienvenido!';
                    submitBtn.classList.remove('btn-primary');
                    submitBtn.classList.add('btn-success');

                    // Redirigir siempre al panel unificado
                    setTimeout(() => {
                        window.location.href = 'trabajadores.html';
                    }, 500);
                } else {
                    // Mostrar error
                    const mensajeError = result.message || result.error || 'Usuario o contraseña incorrectos';
                    errorMessage.textContent = mensajeError;
                    errorDiv.classList.remove('d-none');

                    // Restaurar botón
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Ingresar al Sistema';

                    // Limpiar contraseña
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (error) {
                logger.error('Error en login:', error);
                errorMessage.textContent = 'Error al procesar la solicitud. Por favor intenta nuevamente.';
                errorDiv.classList.remove('d-none');

                // Restaurar botón
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Ingresar al Sistema';
            }
        });

        // Verificar si ya está logueado
        if (authSystem.isLoggedIn()) {
            const user = authSystem.getCurrentUser();
            document.getElementById('current-username').textContent = user.username;
            document.getElementById('current-role').textContent = user.role;
            document.getElementById('logout-btn').style.display = 'block';

            // Redirigir siempre al panel unificado si está logueado
            if (!window.location.href.includes('trabajadores.html')) {
                window.location.href = 'trabajadores.html';
            }
        }

        // Botón de logout
        document.getElementById('logout-btn').addEventListener('click', function () {
            authSystem.logout();
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
